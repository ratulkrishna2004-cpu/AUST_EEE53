<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEE 2.2 Exam Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --lightning: #2ecc71;
            --thor-green: #00ff00;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('./varsity-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .header h1 { 
            margin-top: 40px; 
            margin-bottom: 0; 
            font-size: 2.2rem; 
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--lightning);
            font-weight: 800;
        }

        /* --- ADMIN BUTTON --- */
        .top-admin-bar {
            position: fixed; top: 15px; right: 15px; z-index: 200;
        }
        .admin-btn {
            padding: 8px 20px; border-radius: 20px; font-weight: 800; font-size: 0.78rem;
            background: rgba(0,0,0,0.6); color: #fff; border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer; letter-spacing: 1px; backdrop-filter: blur(6px);
            transition: all 0.25s;
        }
        .admin-btn.logged-in {
            border-color: var(--lightning); color: var(--lightning);
            box-shadow: 0 0 15px rgba(46,204,113,0.35);
        }

        /* --- SYLLABUS BUTTON --- */
        .syllabus-btn-wrap { margin-top: 22px; text-align: center; }
        .syllabus-btn {
            padding: 13px 40px; border-radius: 30px; font-weight: 800; font-size: 0.95rem;
            background: linear-gradient(135deg,#11998e,#38ef7d); color: #000; border: none;
            cursor: pointer; letter-spacing: 1px; box-shadow: 0 8px 22px rgba(17,153,142,0.4);
            transition: transform 0.2s;
        }
        .syllabus-btn:active { transform: scale(0.96); }
        
        .wheel-container {
            position: relative;
            width: 360px; height: 360px;
            margin-top: 60px; 
            margin-bottom: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 768px) {
            .wheel-container { width: 480px; height: 480px; margin-top: 80px; }
        }

        .wheel {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 8px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .segment {
            position: absolute;
            width: 50%; height: 50%;
            transform-origin: 100% 100%;
            cursor: pointer;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .s1 { background: linear-gradient(45deg, #ff5f6d, #ffc371); transform: rotate(0deg) skewY(-18deg); }
        .s2 { background: linear-gradient(45deg, #f1c40f, #f39c12); transform: rotate(72deg) skewY(-18deg); }
        .s3 { background: linear-gradient(45deg, #11998e, #38ef7d); transform: rotate(144deg) skewY(-18deg); }
        .s4 { background: linear-gradient(45deg, #00c6ff, #0072ff); transform: rotate(216deg) skewY(-18deg); }
        .s5 { background: linear-gradient(45deg, #8e44ad, #c39bd3); transform: rotate(288deg) skewY(-18deg); }

        .segment span {
            transform: skewY(18deg) rotate(-45deg);
            position: absolute;
            font-weight: 900;
            width: 90px;
            right: 20px; top: 45px;
            font-size: 0.9rem;
        }

        .routine-btn {
            position: absolute;
            width: 85px; height: 85px;
            background: #fff; color: #000;
            border-radius: 50%; border: 4px solid #000;
            cursor: pointer; font-weight: 900;
            z-index: 30;
            font-size: 0.7rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* --- Updated Modal & Routine UI --- */
        .modal {
            display: none; position: fixed; z-index: 100;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
            justify-content: center; align-items: center; padding: 20px 0;
            overflow-y: auto;
        }
        .modal-content { width: 90%; max-width: 500px; text-align: center; margin: auto; }
        .modal-title { color: #ffca3a; font-size: 1.8rem; margin-bottom: 25px; font-weight: 800; }
        
        .routine-card {
            background: #1a1a1a; margin-bottom: 15px;
            padding: 15px 20px; border-radius: 20px; display: flex;
            justify-content: space-between; align-items: center; text-align: left;
            border-left: 6px solid; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .card-left h3 { margin: 0; font-size: 1.1rem; color: #fff; }
        .card-left p { margin: 5px 0 0; font-size: 0.8rem; color: rgba(255,255,255,0.6); }
        .card-right { text-align: right; }
        .card-right .date { font-weight: bold; font-size: 0.9rem; color: #fff; }
        .card-right .day { font-size: 0.8rem; color: rgba(255,255,255,0.5); }

        .close-btn {
            margin-top: 20px; padding: 12px 60px; background: #ff4757; color: #fff;
            border: none; border-radius: 30px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- Updated Subject Info Card --- */
        .info-card {
            width: 85%; max-width: 500px; padding: 25px; border-radius: 25px;
            backdrop-filter: blur(20px); text-align: center; display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-bottom: 60px;
            background: rgba(60, 40, 40, 0.8); border: 2px solid;
        }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .box small { color: #aaa; display: block; margin-bottom: 5px; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }
        .box span { font-weight: 700; font-size: 0.95rem; }
        
        .drive-btn { 
            display: flex; justify-content: center; align-items: center; gap: 8px;
            padding: 16px; background: #fff; color: #000; text-decoration: none; 
            border-radius: 40px; font-weight: 800; font-size: 0.9rem;
            transition: transform 0.2s;
        }
        .drive-btn:active { transform: scale(0.95); }

        /* --- SYLLABUS MODAL --- */
        .syllabus-modal-content { width: 92%; max-width: 680px; text-align: center; margin: auto; }
        .syl-input {
            width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); color:#fff;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 11px 14px;
            font-size: 0.95rem; margin-bottom: 10px; outline: none; font-family: inherit; resize: vertical;
        }
        .syl-form-box {
            background: rgba(20,20,20,0.7); border: 1px solid rgba(46,204,113,0.3);
            border-radius: 14px; padding: 18px; margin-bottom: 20px; text-align: left;
        }
        .syl-save-btn {
            padding: 10px 28px; border-radius: 20px; border: none; background: var(--lightning);
            color: #000; font-weight: 800; cursor: pointer; margin-right: 8px;
        }
        .syl-cancel-btn {
            padding: 10px 22px; border-radius: 20px; border: 1px dashed rgba(255,255,255,0.3);
            background: transparent; color: rgba(255,255,255,0.6); cursor: pointer;
        }
        .add-course-btn {
            padding: 11px 26px; border-radius: 20px; border: 2px dashed var(--lightning);
            background: rgba(46,204,113,0.08); color: var(--lightning); font-weight: 800;
            cursor: pointer; margin-bottom: 18px; letter-spacing: 0.5px;
        }
        .syllabus-table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .syllabus-table { width: 100%; border-collapse: collapse; }
        .syllabus-table th {
            background: rgba(46,204,113,0.15); color: var(--lightning); padding: 12px 10px;
            text-align: left; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .syllabus-table td {
            padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.88rem; text-align: left; vertical-align: top; white-space: pre-wrap;
        }
        .syllabus-table tr:last-child td { border-bottom: none; }
        .action-btn { padding: 5px 12px; margin-right: 5px; border: none; border-radius: 6px; font-weight: 700; font-size: 0.72rem; cursor: pointer; }
        .action-edit { background: #ffca3a; color: #000; }
        .action-delete { background: #ff4757; color: #fff; }

        /* --- FOOTER (matches main site) --- */
        .footer {
            margin-top: auto; padding: 25px 20px 20px; text-align: center;
            background: rgba(0,0,0,0.85); width: 100%; box-sizing: border-box;
            border-top: 1px solid #1a1a1a;
        }
        .footer-top-row { display: flex; justify-content: center; align-items: center; gap: 18px; margin-bottom: 12px; }
        .footer-logo-link { color: var(--lightning); font-weight: bold; font-size: 1.2rem; text-decoration: none; cursor: pointer; }
        .footer-mail-link { color: var(--lightning); font-size: 1.4rem; text-decoration: none; }
        .footer-dev-credit { color: #fff; font-weight: bold; font-size: 0.88rem; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="top-admin-bar">
        <button id="adminBtn" class="admin-btn" onclick="toggleAdminLogin()"><i class="fas fa-user-shield"></i> Admin</button>
    </div>

    <div class="header">
        <h1>AUST EEE 2.2 EXAM PORTAL</h1>
        <div class="syllabus-btn-wrap">
            <button class="syllabus-btn" onclick="openSyllabus()"><i class="fas fa-book"></i> Syllabus</button>
        </div>
    </div>

    <div class="wheel-container">
        <div class="wheel" id="wheelFrame">
            <div class="segment s1" onclick="loadCourse(0)"><span>EEE-2203</span></div>
            <div class="segment s2" onclick="loadCourse(1)"><span>EEE-2213</span></div>
            <div class="segment s3" onclick="loadCourse(2)"><span>MATH-2203</span></div>
            <div class="segment s4" onclick="loadCourse(3)"><span>HUM-2201</span></div>
            <div class="segment s5" onclick="loadCourse(4)"><span>HUM-2209</span></div>
        </div>

        <button class="routine-btn" onclick="openRoutine()">VIEW<br>ROUTINE</button>
    </div>

    <div id="infoCard" class="info-card">
        <h2 id="title" style="margin:0; color: #fff; font-size: 1.6rem; font-weight: 800;">Subject Title</h2>
        <div class="details-grid">
            <div class="box"><small>📅 DATE</small><span id="dateText">-</span></div>
            <div class="box"><small>🕒 TIME</small><span id="timeText">-</span></div>
            <div class="box"><small>🗓 DAY</small><span id="dayText">-</span></div>
            <div class="box"><small>📍 VENUE</small><span>AUST Campus</span></div>
        </div>
        <a id="driveBtn" href="#" target="_blank" class="drive-btn">📂 OPEN MATERIALS DRIVE</a>
    </div>

    <div id="routineModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">MID-Term Exam Routine</div>
            <div id="cardList"></div>
            <button class="close-btn" onclick="closeRoutine()">CLOSE</button>
        </div>
    </div>

    <!-- ======================== SYLLABUS MODAL ======================== -->
    <div id="syllabusModal" class="modal">
        <div class="modal-content syllabus-modal-content">
            <div class="modal-title"><i class="fas fa-book-open"></i> Course Syllabus</div>

            <button id="addCourseBtn" class="add-course-btn" style="display:none;" onclick="showSylForm()">
                <i class="fas fa-plus"></i> Add Course
            </button>

            <div id="sylFormBox" class="syl-form-box" style="display:none;">
                <label style="color:var(--lightning); font-size:0.78rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; display:block; margin-bottom:6px;">Course Name</label>
                <input type="text" id="sylCourseInput" class="syl-input" placeholder="e.g. EEE 2203: Electronics II">
                <label style="color:var(--lightning); font-size:0.78rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; display:block; margin-bottom:6px;">Syllabus</label>
                <textarea id="sylTextInput" class="syl-input" rows="4" placeholder="Write the syllabus / topics here..."></textarea>
                <div>
                    <button class="syl-save-btn" onclick="submitSyllabus()">Save</button>
                    <button class="syl-cancel-btn" onclick="cancelSylForm()">Cancel</button>
                </div>
            </div>

            <div class="syllabus-table-wrap">
                <table class="syllabus-table">
                    <thead>
                        <tr>
                            <th style="width:35%;">Course Name</th>
                            <th>Syllabus</th>
                            <th id="sylActionsHeader" style="display:none; width:110px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="syllabusTableBody">
                        <tr><td colspan="3" style="text-align:center; color:#888;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <button class="close-btn" onclick="closeSyllabus()">CLOSE</button>
        </div>
    </div>

    <!-- ======================== FOOTER (matches main site) ======================== -->
    <footer class="footer">
        <div class="footer-top-row">
            <a onclick="window.location.href='https://spardho53.xyz/#home'" class="footer-logo-link" style="cursor:pointer;">AUST EEE-53</a>
            <a href="mailto:austeee53@gmail.com" class="footer-mail-link"><i class="fas fa-envelope-open-text"></i></a>
        </div>
        <div class="footer-dev-credit">Designed &amp; Developed by: Ratul Krishna Mojumder</div>
    </footer>

    <script>
        // ============================================================
        // WHEEL / ROUTINE (existing functionality)
        // ============================================================
        const courseData = [
            { name: "Electrical Properties of Materials", code: "EEE-2213", date: "Aug 09, 2026", time: "09:30 AM-10:30 AM", day: "Sunday", link: "https://drive.google.com/drive/folders/1FVMwC7q5E79481-0C_Vc46dXD-nUi5Z4?usp=drive_link", color: "#ff5f6d" },
            { name: "Accountings & Economics", code: "HUM-2209", date: "Aug 10, 2026", time: "09:30 AM-10:30 AM", day: "Wednesday", link: "https://drive.google.com/drive/folders/1GEVQa0G9ospLTzpOhLucLVvp31l7Jv_y?usp=drive_link", color: "#f1c40f" },
            { name: "Electronics II", code: "EEE-2203", date: "Aug 11, 2026", time: "09:30 AM-10:30 AM", day: "Monday", link: "https://drive.google.com/drive/folders/1rQ5yOtPLS5DuXuImSX838NUMZS8l1-t-?usp=drive_link", color: "#2ecc71" },
            { name: "Mathematics-V", code: "MATH-2203", date: "Aug 12, 2026", time: "09:30 AM-10:30 AM", day: "Sunday", link: "https://drive.google.com/drive/folders/1xwa4-TZd-s6Twj9wj2BblgJzoIcB9swD?usp=drive_link" },
            { name: "Bengali Language & Literature", code: "HUM-2201", date: "Aug 13, 2026", time: "09:30 AM-10:30 AM", day: "Wednesday", link: "https://drive.google.com/drive/folders/13d6ykLhvC4NvLVMRPfTj87zT6Vw2s0IE?usp=drive_link", color: "#8e44ad" }
        ];

        function loadCourse(id) {
            const course = courseData[id];
            document.getElementById('wheelFrame').style.transform = `rotate(${-id * 72}deg)`;
            const card = document.getElementById('infoCard');
            card.style.display = 'block';
            card.style.borderColor = course.color;
            card.style.background = `linear-gradient(rgba(30, 20, 20, 0.9), rgba(10, 10, 10, 0.95))`;
            
            document.getElementById('title').innerText = course.name;
            document.getElementById('dateText').innerText = course.date;
            document.getElementById('timeText').innerText = course.time;
            document.getElementById('dayText').innerText = course.day;
            document.getElementById('driveBtn').href = course.link;
            
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function openRoutine() {
            const modal = document.getElementById('routineModal');
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = ''; 
            courseData.forEach(c => {
                cardList.innerHTML += `
                    <div class="routine-card" style="border-color: ${c.color}">
                        <div class="card-left">
                            <h3>${c.name}</h3>
                            <p>${c.code} | ${c.time}</p>
                        </div>
                        <div class="card-right">
                            <div class="date">${c.date}</div>
                            <div class="day">${c.day}</div>
                        </div>
                    </div>
                `;
            });
            modal.style.display = 'flex';
        }

        function closeRoutine() {
            document.getElementById('routineModal').style.display = 'none';
        }

        // ============================================================
        // FIREBASE (same project/database as main site)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyA42cAhFc4ygHqmkZTIr2Rc87eEF_QA4R4",
            authDomain: "spardho-53.firebaseapp.com",
            databaseURL: "https://spardho-53-default-rtdb.firebaseio.com",
            projectId: "spardho-53",
            storageBucket: "spardho-53.firebasestorage.app",
            messagingSenderId: "1042755226180",
            appId: "1:1042755226180:web:76d4202bfc0352a240ca11"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        // ============================================================
        // ADMIN LOGIN
        // ============================================================
        const MID_ADMIN_PASS = "092418";

        function toggleAdminLogin() {
            const isAdmin = sessionStorage.getItem('midAdmin') === 'true';
            if (isAdmin) {
                if (confirm("Log out from Admin?")) {
                    sessionStorage.removeItem('midAdmin');
                    updateAdminBtnUI();
                }
                return;
            }
            const pass = prompt("Enter Admin Password:");
            if (pass === null) return;
            if (pass === MID_ADMIN_PASS) {
                sessionStorage.setItem('midAdmin', 'true');
                updateAdminBtnUI();
                alert("Admin Login Successful.");
            } else {
                alert("Wrong Password. Access Denied.");
            }
        }

        function updateAdminBtnUI() {
            const isAdmin = sessionStorage.getItem('midAdmin') === 'true';
            const btn = document.getElementById('adminBtn');
            btn.innerHTML = isAdmin
                ? '<i class="fas fa-user-shield"></i> Admin ✓'
                : '<i class="fas fa-user-shield"></i> Admin';
            btn.classList.toggle('logged-in', isAdmin);

            document.getElementById('addCourseBtn').style.display = isAdmin ? 'inline-flex' : 'none';
            document.getElementById('sylActionsHeader').style.display = isAdmin ? 'table-cell' : 'none';
            renderSyllabusTable();
        }

        // ============================================================
        // SYLLABUS ENGINE
        // ============================================================
        let editingSylKey = null;
        let syllabusListenerAttached = false;

        function openSyllabus() {
            document.getElementById('syllabusModal').style.display = 'flex';
            updateAdminBtnUI();
            if (!syllabusListenerAttached) {
                renderSyllabusTable();
                syllabusListenerAttached = true;
            }
        }

        function closeSyllabus() {
            document.getElementById('syllabusModal').style.display = 'none';
            cancelSylForm();
        }

        function showSylForm() {
            editingSylKey = null;
            document.getElementById('sylCourseInput').value = '';
            document.getElementById('sylTextInput').value = '';
            document.getElementById('sylFormBox').style.display = 'block';
        }

        function cancelSylForm() {
            editingSylKey = null;
            document.getElementById('sylFormBox').style.display = 'none';
            document.getElementById('sylCourseInput').value = '';
            document.getElementById('sylTextInput').value = '';
        }

        function submitSyllabus() {
            const course = document.getElementById('sylCourseInput').value.trim();
            const syllabus = document.getElementById('sylTextInput').value.trim();
            if (!course || !syllabus) { alert("Please fill in both Course Name and Syllabus."); return; }
            const payload = { course, syllabus };

            const saveRef = editingSylKey
                ? database.ref('syllabus/' + editingSylKey).update(payload)
                : database.ref('syllabus').push(payload);

            saveRef.then(() => {
                cancelSylForm();
                renderSyllabusTable();
            }).catch(err => alert("Failed: " + err.message));
        }

        function editSyllabusRow(key, course, syllabus) {
            editingSylKey = key;
            document.getElementById('sylCourseInput').value = course;
            document.getElementById('sylTextInput').value = syllabus;
            document.getElementById('sylFormBox').style.display = 'block';
            document.getElementById('sylFormBox').scrollIntoView({ behavior: 'smooth' });
        }

        function deleteSyllabusRow(key) {
            if (confirm("Are you sure you want to delete this course syllabus?")) {
                database.ref('syllabus/' + key).remove().then(renderSyllabusTable);
            }
        }

        function renderSyllabusTable() {
            const isAdmin = sessionStorage.getItem('midAdmin') === 'true';
            database.ref('syllabus').on('value', (snapshot) => {
                const tbody = document.getElementById('syllabusTableBody');
                tbody.innerHTML = '';
                if (!snapshot.exists()) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">No syllabus added yet.</td></tr>`;
                    return;
                }
                snapshot.forEach(child => {
                    const key = child.key;
                    const d = child.val();
                    const actionsCell = isAdmin
                        ? `<td>
                             <button class="action-btn action-edit" onclick="editSyllabusRow('${key}', \`${(d.course||'').replace(/`/g,'')}\`, \`${(d.syllabus||'').replace(/`/g,'')}\`)">Edit</button>
                             <button class="action-btn action-delete" onclick="deleteSyllabusRow('${key}')">Delete</button>
                           </td>`
                        : '';
                    tbody.innerHTML += `<tr>
                        <td>${d.course}</td>
                        <td>${d.syllabus}</td>
                        ${actionsCell}
                    </tr>`;
                });
            });
        }

        // Init admin button state on load
        document.addEventListener('DOMContentLoaded', () => {
            updateAdminBtnUI();
        });
    </script>
</body>
</html>
