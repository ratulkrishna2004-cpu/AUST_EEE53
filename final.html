<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEE 2.2 Exam Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --lightning: #2ecc71;
            --thor-green: #00ff00;
            --steel-light: #e9eef2;
            --steel-dark: #3b4450;
            --ninja-black: #0b0d10;
            --ninja-red: #e63946;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('./varsity-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .header h1 { 
            margin-top: 40px; 
            margin-bottom: 0; 
            font-size: 2.2rem; 
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--lightning);
            font-weight: 800;
        }
        
        .wheel-container {
            position: relative;
            width: 340px; height: 340px;
            margin-top: 350px; 
            margin-bottom: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 768px) {
            .wheel-container { width: 480px; height: 480px; margin-top: 400px; }
        }

        .hammer-box {
            position: absolute;
            top: -420px; 
            left: 50%; 
            transform: translateX(-60%); 
            width: 390px; 
            height: 390px;
            z-index: 50; 
            pointer-events: auto; 
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .hammer-box { width: 430px; height: 430px; top: -520px; transform: translateX(-60%); }
        }

        .hammer-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: thor-shock 0.4s infinite alternate, floating 4s ease-in-out infinite;
            filter: drop-shadow(0 0 10px var(--lightning));
        }

        @keyframes thor-shock {
            0% { filter: drop-shadow(0 0 5px var(--lightning)) brightness(1); transform: scale(1); }
            50% { filter: drop-shadow(0 0 25px #fff) drop-shadow(0 0 45px var(--thor-green)) brightness(1.5); transform: scale(1.02); }
            100% { filter: drop-shadow(0 0 12px var(--lightning)) brightness(1.1); transform: scale(1); }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* ===================== NINJA WHEEL ===================== */

        /* Outer notched steel ring that slowly turns, like a shuriken edge */
        .wheel-rim {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: repeating-conic-gradient(#3a414b 0deg 3deg, #14171b 3deg 6deg);
            z-index: 5;
            box-shadow: 0 0 0 2px #5a626b, 0 0 26px rgba(46,204,113,0.55);
        }

        .wheel {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid var(--ninja-black);
            transition: transform 1.1s cubic-bezier(0.2, 0.9, 0.3, 1.08);
            z-index: 10;
        }

        /* Each segment = full-size layer clipped to a wedge pointing UP, rotated by i * 360/n */
        .segment {
            position: absolute;
            inset: 0;
            cursor: pointer;
            transition: filter 0.4s;
        }
        .segment:hover { filter: brightness(1.15); }
        .wheel.has-active .segment:not(.active) { filter: brightness(0.55) saturate(0.8); }
        .wheel.has-active .segment.active { filter: brightness(1.15) saturate(1.15); }

        .segment span {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Russo One', 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 1px;
            white-space: nowrap;
            color: #fff;
            text-shadow: 0 0 2px #000, 0 0 2px #000, 0 3px 8px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Dark "blade" lines between segments (rotate with the wheel) */
        .blade-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }

        /* Static shading + gloss on top of the wheel */
        .wheel-gloss {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 12;
            background:
                radial-gradient(circle, rgba(0,0,0,0.65) 0 24%, transparent 42%),
                radial-gradient(circle, transparent 76%, rgba(0,0,0,0.5) 100%),
                linear-gradient(155deg, rgba(255,255,255,0.22), transparent 45%);
            box-shadow: inset 0 0 0 5px var(--ninja-black), inset 0 0 30px rgba(0,0,0,0.7);
        }

        /* Katana slash flash on every click */
        .slash {
            position: absolute;
            left: -15%;
            top: 50%;
            width: 130%;
            height: 4px;
            border-radius: 4px;
            background: linear-gradient(90deg, transparent, #fff 35%, var(--thor-green) 65%, transparent);
            filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px var(--lightning));
            transform: rotate(-32deg) scaleX(0);
            opacity: 0;
            z-index: 25;
            pointer-events: none;
        }
        .slash.go { animation: slash 0.5s ease-out; }
        @keyframes slash {
            0%   { transform: rotate(-32deg) scaleX(0);   opacity: 1; }
            45%  { transform: rotate(-32deg) scaleX(1);   opacity: 1; }
            100% { transform: rotate(-32deg) scaleX(1.05); opacity: 0; }
        }

        /* Kunai pointer at the top */
        .kunai {
            position: absolute;
            top: -46px;
            left: 50%;
            width: 34px;
            height: 84px;
            transform: translateX(-50%);
            z-index: 60;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)) drop-shadow(0 0 8px rgba(46,204,113,0.6));
        }

        /* Shuriken hub in the center */
        .hub {
            position: absolute;
            top: 50%; left: 50%;
            width: 170px; height: 170px;
            transform: translate(-50%, -50%);
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .shuriken-wrap {
            position: absolute;
            inset: 0;
            transition: transform 1.1s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        .shuriken {
            width: 100%; height: 100%;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        .routine-btn {
            position: relative;
            width: 84px; height: 84px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #2a2f36, #07080a 70%);
            color: #fff;
            border: 3px solid #c9d1d9;
            font-family: 'Russo One', 'Segoe UI', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 1px;
            line-height: 1.3;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 0 4px var(--ninja-black), 0 0 18px rgba(46,204,113,0.55), 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .routine-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 0 4px var(--ninja-black), 0 0 30px var(--thor-green), 0 10px 25px rgba(0,0,0,0.6);
        }
        .routine-btn:active { transform: scale(0.95); }

        /* --- Updated Modal & Routine UI --- */
        .modal {
            display: none; position: fixed; z-index: 100;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
            justify-content: center; align-items: center; padding: 20px 0;
        }
        .modal-content { width: 90%; max-width: 500px; text-align: center; }
        .modal-title { color: #ffca3a; font-size: 1.8rem; margin-bottom: 25px; font-weight: 800; }
        
        .routine-card {
            background: #1a1a1a; margin-bottom: 15px;
            padding: 15px 20px; border-radius: 20px; display: flex;
            justify-content: space-between; align-items: center; text-align: left;
            border-left: 6px solid; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .card-left h3 { margin: 0; font-size: 1.1rem; color: #fff; }
        .card-left p { margin: 5px 0 0; font-size: 0.8rem; color: rgba(255,255,255,0.6); }
        .card-right { text-align: right; }
        .card-right .date { font-weight: bold; font-size: 0.9rem; color: #fff; }
        .card-right .day { font-size: 0.8rem; color: rgba(255,255,255,0.5); }

        .close-btn {
            margin-top: 20px; padding: 12px 60px; background: #ff4757; color: #fff;
            border: none; border-radius: 30px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- Updated Subject Info Card --- */
        .info-card {
            width: 85%; max-width: 500px; padding: 25px; border-radius: 25px;
            backdrop-filter: blur(20px); text-align: center; display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-bottom: 60px;
            background: rgba(60, 40, 40, 0.8); border: 2px solid;
        }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .box small { color: #aaa; display: block; margin-bottom: 5px; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }
        .box span { font-weight: 700; font-size: 0.95rem; }
        
        .drive-btn { 
            display: flex; justify-content: center; align-items: center; gap: 8px;
            padding: 16px; background: #fff; color: #000; text-decoration: none; 
            border-radius: 40px; font-weight: 800; font-size: 0.9rem;
            transition: transform 0.2s;
        }
        .drive-btn:active { transform: scale(0.95); }

        .footer { margin-top: auto; padding: 28px 20px 20px; text-align: center; background: rgba(0,0,0,0.8); width: 100%; font-size: 0.9rem; box-sizing: border-box; }

        /* --- Glowing "Share Your Note" button --- */
        .share-btn {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 14px 36px;
            border-radius: 40px;
            border: 2px solid var(--lightning);
            background: linear-gradient(135deg, #0b0d10, #1c2128);
            color: #fff;
            text-decoration: none;
            font-family: 'Russo One', 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            /* steady glow, no pulsing */
            box-shadow: 0 0 14px rgba(46,204,113,0.7), 0 0 32px rgba(46,204,113,0.4);
            text-shadow: 0 0 8px var(--lightning);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .share-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--thor-green), 0 0 44px rgba(46,204,113,0.7);
        }
        .share-btn:active { transform: scale(0.95); }

        /* Phone/OS "reduce motion" setting on: no spinning at all */
        @media (prefers-reduced-motion: reduce) {
            .wheel, .shuriken-wrap { transition: none; }
            .slash.go { animation: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AUST EEE 2.2 Final EXAM PORTAL</h1>
    </div>

    <div class="wheel-container">
        <div class="hammer-box" onclick="window.open('https://drive.google.com/drive/u/2/folders/1GS40dJrG7EhwZWNLSWz0ty37Apuphqob', '_blank')">
            <img src="thor-hammer.png" alt="Mjolnir" class="hammer-img">
        </div>

        <div class="wheel-rim"></div>

        <!-- Segments are generated from courseData in the script below -->
        <div class="wheel" id="wheelFrame">
            <div class="blade-lines" id="bladeLines"></div>
        </div>

        <div class="wheel-gloss"></div>
        <div class="slash" id="slash"></div>

        <!-- Kunai pointer -->
        <svg class="kunai" viewBox="0 0 40 100" aria-hidden="true">
            <defs>
                <linearGradient id="kunaiSteel" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#8a95a0"/>
                    <stop offset="0.5" stop-color="#f4f7fa"/>
                    <stop offset="1" stop-color="#6b7580"/>
                </linearGradient>
            </defs>
            <circle cx="20" cy="9" r="6.5" fill="none" stroke="url(#kunaiSteel)" stroke-width="3"/>
            <rect x="16" y="15" width="8" height="30" rx="1.5" fill="#15171b"/>
            <path d="M16 19 L24 23 M16 25 L24 29 M16 31 L24 35 M16 37 L24 41" stroke="#e63946" stroke-width="2.4"/>
            <rect x="11" y="44" width="18" height="4" rx="1" fill="url(#kunaiSteel)"/>
            <path d="M20 99 L32 62 L20 48 L8 62 Z" fill="url(#kunaiSteel)" stroke="#2a2f36" stroke-width="1"/>
            <path d="M20 50 L20 95" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
        </svg>

        <!-- Shuriken hub with the routine button -->
        <div class="hub">
            <div class="shuriken-wrap" id="shurikenWrap">
                <svg class="shuriken" viewBox="-50 -50 100 100" aria-hidden="true">
                    <defs>
                        <linearGradient id="shurikenSteel" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#f1f5f9"/>
                            <stop offset="0.5" stop-color="#8b97a3"/>
                            <stop offset="1" stop-color="#3b4450"/>
                        </linearGradient>
                    </defs>
                    <path d="M0 -49 Q4 -16 12 -12 L49 0 Q16 4 12 12 L0 49 Q-4 16 -12 12 L-49 0 Q-16 -4 -12 -12 Z"
                          fill="url(#shurikenSteel)" stroke="#0b0d10" stroke-width="1.5"/>
                    <path d="M0 -49 Q4 -16 12 -12 L0 0 Z M49 0 Q16 4 12 12 L0 0 Z M0 49 Q-4 16 -12 12 L0 0 Z M-49 0 Q-16 -4 -12 -12 L0 0 Z"
                          fill="rgba(0,0,0,0.35)"/>
                </svg>
            </div>
            <button class="routine-btn" onclick="openRoutine()">VIEW<br>ROUTINE</button>
        </div>
    </div>

    <div id="infoCard" class="info-card">
        <h2 id="title" style="margin:0; color: #fff; font-size: 1.6rem; font-weight: 800;">Subject Title</h2>
        <div class="details-grid">
            <div class="box"><small>📅 DATE</small><span id="dateText">-</span></div>
            <div class="box"><small>🕒 TIME</small><span id="timeText">-</span></div>
            <div class="box"><small>🗓 DAY</small><span id="dayText">-</span></div>
            <div class="box"><small>📍 VENUE</small><span>AUST Campus</span></div>
        </div>
        <a id="driveBtn" href="#" target="_blank" class="drive-btn">📂 OPEN MATERIALS DRIVE</a>
    </div>

    <div id="routineModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">MID-Term Exam Routine</div>
            <div id="cardList"></div>
            <button class="close-btn" onclick="closeRoutine()">CLOSE</button>
        </div>
    </div>

    <div class="footer">
        <a class="share-btn" href="https://forms.gle/TDzA1bhX6ydURPQRA" target="_blank" rel="noopener">📝 Share Your Note</a>
        <div>Developed by: <b>Ratul Krishna Mojumder</b></div>
    </div>

    <script>
        // gradient = the original wheel colors; color = used for card borders
        const courseData = [
            { name: "Electronics II", code: "EEE-2203", date: "October 26, 2026", time: "09:30 AM-12:00 PM", day: "Monday", link: "https://drive.google.com/drive/folders/17jFdM2_RS9-OZ1nWQgWwgbDOyUhAOwgM", gradient: ["#ff5f6d", "#ffc371"], color: "#ff5f6d" },
            { name: "Bengali Language & Literature", code: "HUM-2201", date: "October 29, 2026", time: "09:30 AM-12:00 PM", day: "Thursday", link: "https://drive.google.com/drive/folders/1nxaPCtlpf9zBT0PpmeVm4WqAIyvS6NVF", gradient: ["#f1c40f", "#f39c12"], color: "#f1c40f" },
            { name: "Mathematics-V", code: "MATH-2203", date: "November 03, 2026", time: "09:30 AM-12:00 PM", day: "Tuesday", link: "https://drive.google.com/drive/folders/1xHZ4M_MF0waMjF8W4MF6DRWiwHuO44sc", gradient: ["#11998e", "#38ef7d"], color: "#38ef7d" },
            { name: "Accountings & Economics", code: "HUM-2209", date: "November 08, 2026", time: "09:30 AM-12:00 PM", day: "Sunday", link: "https://drive.google.com/drive/folders/1iZNYiJW26wRWg84R4J1chjkuIYPIxl9L", gradient: ["#00c6ff", "#0072ff"], color: "#00c6ff" },
            { name: "Electrical Properties of Materials", code: "EEE-2213", date: "November 16, 2026", time: "09:30 AM-12:00 PM", day: "Monday", link: "https://drive.google.com/drive/folders/1VJidTTB8D7CS3TWAiBWALXKfdaDbKs11", gradient: ["#8e44ad", "#c39bd3"], color: "#c39bd3" }
        ];

        const wheel = document.getElementById('wheelFrame');
        const bladeLines = document.getElementById('bladeLines');
        const shurikenWrap = document.getElementById('shurikenWrap');
        const slash = document.getElementById('slash');

        const SEG_ANGLE = 360 / courseData.length;   // 72deg for 5 courses
        let currentRotation = 0;
        let shurikenRotation = 0;

        // Wedge shape for one segment, pointing up
        const halfRad = (SEG_ANGLE / 2) * Math.PI / 180;
        const off = 50 * Math.tan(halfRad) + 0.5;     // +0.5% overlap hides hairline gaps
        const wedge = `polygon(50% 50%, ${50 - off}% 0%, ${50 + off}% 0%)`;

        // Dark blade lines exactly on the segment borders
        bladeLines.style.background =
            `repeating-conic-gradient(from ${SEG_ANGLE / 2 - 0.8}deg, rgba(10,12,15,0.95) 0deg 1.6deg, transparent 1.6deg ${SEG_ANGLE}deg)`;

        // Build the wheel: segment i is centered at (i * SEG_ANGLE) degrees, clockwise from the top
        courseData.forEach((c, i) => {
            const seg = document.createElement('div');
            seg.className = 'segment';
            seg.style.clipPath = wedge;
            seg.style.webkitClipPath = wedge;
            seg.style.transform = `rotate(${i * SEG_ANGLE}deg)`;
            seg.style.background = `linear-gradient(90deg, ${c.gradient[0]} 22%, ${c.gradient[1]} 78%)`;
            seg.innerHTML = `<span>${c.code}</span>`;
            seg.addEventListener('click', () => loadCourse(i));
            wheel.insertBefore(seg, bladeLines);
        });

        function loadCourse(id) {
            const course = courseData[id];

            // Ninja spin: one extra full turn, then land segment `id` under the kunai
            const target = -id * SEG_ANGLE;
            const delta = ((target - currentRotation) % 360 + 540) % 360 - 180;
            currentRotation += delta + (delta >= 0 ? 360 : -360);
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Shuriken hub whips around
            shurikenRotation += 720;
            shurikenWrap.style.transform = `rotate(${shurikenRotation}deg)`;

            // Katana slash flash
            slash.classList.remove('go');
            void slash.offsetWidth;
            slash.classList.add('go');

            // Highlight selected, dim the others
            wheel.classList.add('has-active');
            wheel.querySelectorAll('.segment').forEach((s, i) => s.classList.toggle('active', i === id));

            const card = document.getElementById('infoCard');
            card.style.display = 'block';
            card.style.borderColor = course.color;
            card.style.background = `linear-gradient(rgba(30, 20, 20, 0.9), rgba(10, 10, 10, 0.95))`;
            
            document.getElementById('title').innerText = course.name;
            document.getElementById('dateText').innerText = course.date;
            document.getElementById('timeText').innerText = course.time;
            document.getElementById('dayText').innerText = course.day;
            document.getElementById('driveBtn').href = course.link;
            
            // Only nudge the page if the card is actually off-screen (no forced jump to center)
            const r = card.getBoundingClientRect();
            if (r.top > window.innerHeight - 80 || r.bottom < 0) {
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function openRoutine() {
            const modal = document.getElementById('routineModal');
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = ''; 
            courseData.forEach(c => {
                cardList.innerHTML += `
                    <div class="routine-card" style="border-color: ${c.color}">
                        <div class="card-left">
                            <h3>${c.name}</h3>
                            <p>${c.code} | ${c.time}</p>
                        </div>
                        <div class="card-right">
                            <div class="date">${c.date}</div>
                            <div class="day">${c.day}</div>
                        </div>
                    </div>
                `;
            });
            modal.style.display = 'flex';
        }

        function closeRoutine() {
            document.getElementById('routineModal').style.display = 'none';
        }
    </script>
</body>
</html>
